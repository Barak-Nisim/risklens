<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>RiskLens</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <h1>RiskLens</h1>
    <p class="subtitle">AI-assisted enterprise security readiness assessment.</p>

    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/assess">
      <label for="answers_yaml">Answers YAML (NIST CSF framework)</label>
      <textarea id="answers_yaml" name="answers_yaml" rows="20" spellcheck="false">{{ answers_yaml }}</textarea>

      <div class="controls">
        <label class="checkbox">
          <input type="checkbox" name="use_ai" value="1" {% if not ai_available %}disabled{% endif %}>
          Include AI narrative
          {% if not ai_available %}
            <span class="hint">(set ANTHROPIC_API_KEY to enable)</span>
          {% endif %}
        </label>
        <button type="submit">Run assessment</button>
      </div>
    </form>
  </main>
</body>
</html>
