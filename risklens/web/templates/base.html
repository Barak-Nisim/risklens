<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RiskLens{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script>document.documentElement.classList.remove("no-js");</script>
  <script>
    (function () {
      var saved = localStorage.getItem("risklens-theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
</head>
<body>
  <header class="site-nav">
    <a href="/" class="brand">
      <svg class="logo-mark" viewBox="0 0 48 48" width="26" height="26" aria-hidden="true">
        <path d="M24 4 L40 10 V22 C40 32 33 40 24 44 C15 40 8 32 8 22 V10 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="21" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="3"/>
        <line x1="26" y1="25" x2="32" y2="31" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span class="wordmark">RiskLens</span>
    </a>
    <nav>
      <a href="/how-it-works">How it works</a>
      <a href="/app" class="nav-cta">Try the demo</a>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle dark and light theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5A8.5 8.5 0 1111.5 3 6.5 6.5 0 0021 12.5z"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>RiskLens is a portfolio project by <strong>Barak Nisim</strong>, built to demonstrate AI-assisted security governance tooling.</p>
    <p>
      <a href="https://github.com/Barak-Nisim/risklens">Source on GitHub</a>
      &middot; MIT License
    </p>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById("theme-toggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var current = document.documentElement.getAttribute("data-theme");
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        var currentlyDark = current === "dark" || (!current && prefersDark);
        var next = currentlyDark ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("risklens-theme", next);
      });
    })();
  </script>

  <script>
    (function () {
      var targets = document.querySelectorAll(".reveal");
      if (!("IntersectionObserver" in window) || targets.length === 0) return;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add("is-visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15 });
      targets.forEach(function (el) { observer.observe(el); });
    })();
  </script>
</body>
</html>
