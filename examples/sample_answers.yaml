# Example filled-out assessment for a fictional mid-size organization.
# Run: risklens assess examples/sample_answers.yaml --no-ai
#
# evidence_type is optional (policy_doc / audit_log / verbal / unspecified).
# Omit it and the answer loads as "unspecified"; see rc-02 below.

org_name: Acme Financial Services
date: "2026-08-24"
framework: nist_csf

answers:
  gov-01: { score: 3, notes: "Risk strategy documented, reviewed annually by leadership", evidence_type: policy_doc }
  gov-02: { score: 2, notes: "Risk appetite defined but not broadly communicated", evidence_type: policy_doc }
  gov-03: { score: 3, notes: "New vendors go through a formal security review before onboarding", evidence_type: policy_doc }
  gov-04: { score: 1, notes: "Existing vendors are almost never reassessed after onboarding", evidence_type: verbal }
  gov-05: { score: 2, notes: "Contract review happens inconsistently", evidence_type: verbal }
  gov-06: { score: 2, notes: "Compliance obligation list exists but is out of date", evidence_type: policy_doc }
  gov-07: { score: 1, notes: "Evidence collection for audits is manual and slow", evidence_type: audit_log }

  id-01: { score: 3, notes: "Asset inventory maintained in CMDB", evidence_type: audit_log }
  id-02: { score: 2, notes: "Data classification applied inconsistently outside core systems", evidence_type: verbal }
  id-03: { score: 2, notes: "Risk assessment happens for large projects, skipped for smaller ones", evidence_type: policy_doc }

  pr-01: { score: 4, notes: "SSO enforced across all core business applications", evidence_type: audit_log }
  pr-02: { score: 4, notes: "MFA required for all privileged and remote access", evidence_type: audit_log }
  pr-03: { score: 3, notes: "Joiner-mover-leaver process documented, mostly followed", evidence_type: policy_doc }
  pr-04: { score: 2, notes: "Access recertification happens roughly annually, not consistently", evidence_type: audit_log }
  pr-05: { score: 3, notes: "Encryption at rest and in transit standard for sensitive data", evidence_type: policy_doc }
  pr-06: { score: 2, notes: "Backup restores tested opportunistically, not on a schedule", evidence_type: verbal }

  dt-01: { score: 2, notes: "Centralized logging covers production, not all environments", evidence_type: audit_log }
  dt-02: { score: 1, notes: "No defined SLA for alert triage", evidence_type: verbal }

  rs-01: { score: 2, notes: "IR plan exists, last updated over a year ago", evidence_type: policy_doc }
  rs-02: { score: 1, notes: "No tabletop exercise run in the past two years", evidence_type: policy_doc }
  rs-03: { score: 2, notes: "Internal comms path defined, customer/regulator path unclear", evidence_type: policy_doc }

  rc-01: { score: 2, notes: "BCP/DR plan exists but not comprehensive across all systems", evidence_type: policy_doc }
  rc-02: { score: 1, notes: "RTO/RPO not formally defined for most systems" }
